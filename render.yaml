# ═══════════════════════════════════════════════════════════════════════
# render.yaml — BoltCall (Render-ready)
#
# Deploy: push this repo to GitHub, create a "Blueprint" instance on
# Render pointing at it, and set ROOM_PASSWORD (or ROOM_PASSWORD_HASH)
# in the dashboard.
#
# ⚠️  BoltCall is a SINGLE-INSTANCE app: the room roster and chat history
# live in process memory. Keep numInstances: 1 and never enable autoscaling.
# (Media itself is peer-to-peer; the server only relays signaling.)
# ═══════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: boltcall
    runtime: node
    plan: starter # "free" works too; free tier spins down when idle
    region: oregon # pick the region closest to your group
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    numInstances: 1

    # Render injects PORT automatically — do NOT hardcode it.
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true # Render stores this in its secret store
      - key: TRUST_PROXY
        value: "1"
      # ── The room ───────────────────────────────────────────────────
      # REQUIRED: the group-call password. Plain text here, or replace
      # with ROOM_PASSWORD_HASH (bcrypt) for stronger handling.
      - key: ROOM_PASSWORD
        sync: false # set manually in the Render dashboard
      - key: ROOM_NAME
        value: boltcall-room
      - key: MEMBER_NAME
        value: thamjj13
      - key: MAX_PARTICIPANTS
        value: "24"
      # ── WebRTC TURN (Metered.ca) ──────────────────────────────────
      # Without these, calls fall back to public STUN (works on easy
      # networks but fails behind symmetric NAT). The API key is NEVER
      # sent to the browser — the server fetches short-lived TURN
      # credentials and serves only those via /api/webrtc/ice-servers.
      - key: METERED_API_KEY
        sync: false
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_TURN_USERNAME
        sync: false
      - key: METERED_TURN_CREDENTIAL
        sync: false
